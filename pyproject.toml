[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "writing-assistant"
version = "0.1.0"
description = "Multi-agent academic writing assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic==0.122.0",
    "PyYAML==6.0.3",
    "PyMuPDF==1.28.0",
    "python-dotenv==1.2.2",
    "tokenizers==0.22.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.11", "mypy>=1.15"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.observability" = ["log_report.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
